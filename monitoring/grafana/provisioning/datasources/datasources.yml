
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'
      httpMethod: 'POST'

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: ${CLICKHOUSE_URL}
    database: ${CLICKHOUSE_DATABASE}
    user: ${CLICKHOUSE_USER}
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    jsonData:
      defaultDatabase: revenueplug
      tlsSkipVerify: false
      usePOST: true
      timeout: 60
    editable: true

  - name: ClickHouse-Direct
    type: grafana-clickhouse-datasource
    access: direct
    url: ${CLICKHOUSE_URL}
    database: ${CLICKHOUSE_DATABASE}
    user: ${CLICKHOUSE_USER}
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    jsonData:
      defaultDatabase: revenueplug
      tlsSkipVerify: false
    editable: false

  - name: AlertManager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: 'prometheus'
    editable: false
