
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'revenueplug'
    environment: 'production'


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'


rule_files:
  - '/etc/prometheus/alerts.yml'


scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'


  - job_name: 'clickhouse'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets:


          - 'clickhouse:8123'
        labels:
          service: 'clickhouse'
          database: 'revenueplug'






  - job_name: 'clickhouse-system'
    scrape_interval: 30s
    static_configs:
      - targets: ['clickhouse:9363']
        labels:
          service: 'clickhouse-system'


  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'revenueplug-server'


  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'


  - job_name: 'kafka'
    scrape_interval: 30s
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: kafka-exporter:9308


  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'


  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          database: 'revenueplug'


  - job_name: 'api'
    scrape_interval: 30s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          app: 'revenueplug-api'
    metrics_path: '/metrics'


  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'


  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
    metrics_path: '/metrics'
